[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.5", features = ["derive"] }
futures-util = "0.3.33"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
