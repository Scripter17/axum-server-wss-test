[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.5.56", features = ["derive"] }
futures-util = "0.3.31"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
